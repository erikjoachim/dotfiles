# dotfiles manifest
#
# Each entry defines one managed configuration file.
# source: path relative to repository root
# target: installation path (supports ~ and %ENV% variables)
# platforms: optional list of supported OS (windows, linux, macos)
#            omitting platforms = all platforms

dotfiles:
  - source: wezterm/.wezterm.lua
    target: ~/.wezterm.lua
    platforms: [windows, linux, macos]

  - source: alacritty/alacritty.toml
    target: ~/AppData/Roaming/alacritty/alacritty.toml
    platforms: [windows]

  - source: alacritty/alacritty.toml
    target: ~/.config/alacritty/alacritty.toml
    platforms: [linux, macos]

  - source: bash/.bashrc
    target: ~/.bashrc
    platforms: [windows, linux, macos]

  - source: ssh/config
    target: ~/.ssh/config

  - source: git/gitconfig
    target: ~/.gitconfig
